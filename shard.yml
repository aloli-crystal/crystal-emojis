name: emojis
version: 0.2.1

description: |
  ~200 commonly-used emoji as embedded SVG, plus an opt-in on-disk
  cache for the rest of the Twemoji catalogue (~4000 SVG, ~18 MB).
  Sourced from Twemoji (CC-BY 4.0). Pure Crystal.

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  emojis:
    main: src/cli.cr

crystal: ">= 1.19.0"
