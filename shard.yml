name: crystal-emojis-lite
version: 0.1.0

description: |
  ~200 commonly-used emoji as embedded SVG, sourced from Twemoji
  (MIT). Pure Crystal, no runtime dependency. For the full
  ~3700-emoji set, use the sibling shard `crystal-emojis-full`.

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

crystal: ">= 1.19.0"
